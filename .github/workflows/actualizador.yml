name: Actualizador Electoral ONPE

on:
  schedule:
    - cron: '*/15 * * * *' # Respaldo por si el auto-disparo falla
  workflow_dispatch: # Permite ejecución manual y auto-disparo via API

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clonar el repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar entorno Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: 4. Extraer datos de la ONPE (Fase 1)
      run: python fase1_onpe_regiones.py

    - name: 5. Verificar que se extrajeron datos
      run: |
        if [ ! -f resultados_onpe.csv ]; then
          echo "❌ ERROR: resultados_onpe.csv no fue generado. Abortando."
          exit 1
        fi
        FILAS=$(python -c "import pandas as pd; df = pd.read_csv('resultados_onpe.csv'); print(len(df))")
        echo "✅ Filas extraídas: $FILAS"
        if [ "$FILAS" -lt "10" ]; then
          echo "❌ ERROR: Se extrajeron menos de 10 filas. La API puede estar bloqueando. Abortando."
          exit 1
        fi

    - name: 6. Procesar ETL y generar JSON (Fase 2)
      run: python fase2_etl_ligero.py

    - name: 7. Guardar cambios y publicar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add resultados_onpe.csv resultados_pivot.json totales_nacionales.json
        # Solo hace commit si hubo cambios reales en los datos
        if git diff --quiet && git diff --staged --quiet; then
          echo "ℹ️ Sin cambios en los datos. No se hace commit."
          echo "HUBO_CAMBIOS=false" >> $GITHUB_ENV
        else
          git commit -m "📊 Actualización automática de actas ONPE [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main
          git push
          echo "✅ Datos actualizados y publicados."
          echo "HUBO_CAMBIOS=true" >> $GITHUB_ENV
        fi

    - name: 8. Auto-disparar siguiente ejecución (mientras haya datos nuevos)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "$HUBO_CAMBIOS" = "true" ]; then
          echo "🔄 Disparando siguiente ejecución via API..."
          sleep 30  # Pausa de 30 segundos antes de volver a consultar la ONPE
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/actualizador.yml/dispatches \
            -d '{"ref":"main"}'
          echo "✅ Siguiente ejecución programada."
        else
          echo "⏹️ Sin cambios. El ciclo se detiene hasta el próximo cron."
        fi
